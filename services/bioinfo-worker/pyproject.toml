[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "oligospace-bioinfo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "biopython==1.85",
  "celery[redis]==5.4.0",
  "pydantic==2.10.6"
]

[project.optional-dependencies]
dev = ["mypy==1.15.0", "pytest==8.3.4", "ruff==0.9.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/oligospace_bioinfo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["oligospace_bioinfo"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
