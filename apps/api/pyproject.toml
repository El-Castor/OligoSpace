[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "oligospace-api"
version = "0.1.0"
description = "OligoSpace registry API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.14.1",
  "asyncpg==0.30.0",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "minio==7.2.20",
  "openpyxl==3.1.5",
  "pydantic-settings==2.7.1",
  "pyjwt[crypto]==2.10.1",
  "python-multipart==0.0.20",
  "sqlalchemy[asyncio]==2.0.38",
  "structlog==25.1.0",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "ruff==0.9.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oligospace_api"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["oligospace_api"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
