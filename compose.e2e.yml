# Isolated E2E stack. Always used through `make test-e2e`, which runs Compose with
# the project name `oligospace-e2e` and `infra/e2e/e2e.env`, so no dev container,
# volume, image tag, or host port is shared with the `oligospace` dev stack.
services:
  caddy:
    ports: !reset []
    volumes: !override
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs: [/data, /config]

  api:
    image: oligospace-e2e-api:latest

  migrate:
    image: oligospace-e2e-api:latest

  bioinfo-worker:
    image: oligospace-e2e-bioinfo-worker:latest

  scientific-scheduler:
    image: oligospace-e2e-bioinfo-worker:latest

  postgres:
    volumes: !override
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    tmpfs: [/var/lib/postgresql/data]

  redis:
    volumes: !reset []
    tmpfs: [/data]

  minio:
    volumes: !reset []
    tmpfs: [/data]
