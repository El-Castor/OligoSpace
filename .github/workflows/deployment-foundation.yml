name: Deployment foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s infra/deployment/tests -v
      - run: docker build --file infra/docker/api/Dockerfile --tag oligospace-deploy01-api-test .
      - name: Deployment tooling lint
        run: |
          docker run --rm --volume "$PWD/infra/deployment:/deployment:ro" --workdir /deployment oligospace-deploy01-api-test micromamba run --name base ruff check .
          docker run --rm --volume "$PWD/infra/deployment:/deployment:ro" --workdir /deployment oligospace-deploy01-api-test micromamba run --name base ruff format --check .
      - name: Disposable bootstrap and persistence only
        env:
          DEPLOY_TEST_API_IMAGE: oligospace-deploy01-api-test
        run: python3 infra/deployment/qualify_postgres.py
