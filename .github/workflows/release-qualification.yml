name: Release image qualification (no publication)
on:
  pull_request:
permissions:
  contents: read
jobs:
  native-image:
    strategy:
      fail-fast: false
      matrix:
        role: [api, web, worker]
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            cpu: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            cpu: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-docker-action@v4
        with:
          context: deploy03
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@v3
        with:
          name: deploy02-native
          driver: docker-container
          endpoint: deploy03
      - name: Verify native runner and build tracked source only
        id: native_build
        env:
          ROLE: ${{ matrix.role }}
          ARCH: ${{ matrix.architecture }}
          CPU: ${{ matrix.cpu }}
        run: |
          test "$(uname -m)" = "$CPU"
          python3 infra/deployment/build_local.py --context deploy03 --builder deploy02-native --architecture "$ARCH" --role "$ROLE" --load-test-images --output "$RUNNER_TEMP/oci"
      - name: Native real Primer3 and worker regressions
        if: matrix.role == 'worker'
        env:
          ARCH: ${{ matrix.architecture }}
        run: |
          source_sha=$(git rev-parse HEAD)
          image="oligospace-qualification/worker:$source_sha"
          docker --context deploy03 build --file infra/docker/bioinfo-worker.Dockerfile --target tooling --tag oligospace-worker-tooling:test .
          docker --context deploy03 run --rm oligospace-worker-tooling:test pytest
          docker --context deploy03 run --rm --volume "$PWD/infra/deployment:/qualification:ro" "$image" /opt/venv/bin/python /qualification/science_probe.py --source "$source_sha" --architecture "$ARCH" > "$RUNNER_TEMP/oci/science.json"
      - name: Native hardened runtime and complete scientific/library checks
        if: matrix.role != 'web'
        env:
          ARCH: ${{ matrix.architecture }}
          ROLE: ${{ matrix.role }}
        run: |
          docker --context deploy03 run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 768m --cpus 2 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777 --env PYTHONDONTWRITEBYTECODE=1 --volume "$PWD/infra/hardening/runtime_probe.py:/qualification/probe.py:ro" "oligospace-qualification/$ROLE:$(git rev-parse HEAD)" /opt/venv/bin/python /qualification/probe.py --architecture "$ARCH" --role "$ROLE" --expect-hardened > "$RUNNER_TEMP/oci/runtime.json"
      - name: Independent open-source S3 candidates and logical cross-restores
        if: matrix.role == 'api'
        run: |
          docker --context deploy03 pull chrislusf/seaweedfs@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
          docker --context deploy03 pull dxflrs/garage@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
          status=0
          for pair in seaweedfs:seaweedfs garage:garage seaweedfs:garage garage:seaweedfs; do
            source=${pair%:*}
            target=${pair#*:}
            python3 infra/deployment/qualify_storage.py --context deploy03 --runtime python --source "$source" --target "$target" --api-image "oligospace-qualification/api:$(git rev-parse HEAD)" --output "$RUNNER_TEMP/storage/$source-to-$target" || status=1
          done
          exit "$status"
      - name: Collect real scan evidence (findings are not accepted)
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        env:
          ARCH: ${{ matrix.architecture }}
        run: |
          artifact=$(find "$RUNNER_TEMP/oci" -name '*.oci.tar' -print -quit)
          python3 infra/deployment/scan_artifact.py --context deploy03 --archive "$artifact" --architecture "$ARCH" --source "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/oci/scan.json"
      - name: Record an unexecuted scan explicitly when prerequisites failed
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "oci/scan.json"
          if not report.exists():
              report.parent.mkdir(parents=True, exist_ok=True)
              report.write_text(json.dumps({"execution": "not_executed", "gate": "not_verified", "rule_id": "SCAN_PREREQUISITE_FAILED", "raw_matches_retained": False}) + "\n")
          PY
      - name: Retain sanitized evidence only, never OCI images or raw scan matches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.architecture }}-${{ matrix.role }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/oci/*-oci-report.json
            ${{ runner.temp }}/oci/qualification-manifest.json
            ${{ runner.temp }}/oci/scan.json
            ${{ runner.temp }}/oci/science.json
            ${{ runner.temp }}/oci/runtime.json
            ${{ runner.temp }}/oci/*-supply-chain/*.json
            ${{ runner.temp }}/storage/**/storage-report.json
  compare-evidence:
    needs: native-image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: qualification-*
          path: ${{ runner.temp }}/reports
      - run: python3 infra/deployment/collect_reports.py --input "$RUNNER_TEMP/reports" --output "$RUNNER_TEMP/combined"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-multiarch-comparison
          retention-days: 7
          path: ${{ runner.temp }}/combined
