name: MVP02 scientific end-to-end acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-keycloak-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Scientific acceptance with real Keycloak, PostgreSQL and Primer3
        run: python3 infra/auth-qualification/run.py --scientific
      - name: Retain sanitized scientific evidence and synthetic captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp02-scientific-evidence
          path: infra/auth-qualification/scientific-evidence/
          if-no-files-found: error
          retention-days: 14
